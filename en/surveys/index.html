<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Earn Coins | Mohanad Games</title>
    <meta name="description" content="Take a short survey and earn coins in Mohanad Games.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mohanadgames.com/en/surveys/">
    <link rel="alternate" hreflang="ar" href="https://mohanadgames.com/surveys/">
    <link rel="alternate" hreflang="en" href="https://mohanadgames.com/en/surveys/">
    <link rel="alternate" hreflang="x-default" href="https://mohanadgames.com/surveys/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/images/logo-sm.png">
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-cpx-app-id="34253">
    <div class="page">
        <div class="topbar">
            <a class="lang-link" href="/surveys/" hreflang="ar">العربية</a>
        </div>

        <header class="hero">
            <img class="hero-logo" src="/images/logo-sm.png" alt="Mohanad Games" width="88" height="88" fetchpriority="high">
            <h1>Earn Coins</h1>
            <p>Complete a short survey and earn coins for our games.</p>
            <div class="actions">
                <a class="btn btn-ghost" href="/en/">Back to home</a>
            </div>
        </header>

        <main>
            <section id="survey-gate" class="survey-gate">
                <h2 class="survey-gate-title">Enter your ID</h2>
                <form id="survey-gate-form">
                    <div class="survey-field">
                        <label for="survey-user-id">Player ID</label>
                        <input id="survey-user-id" name="user_id" type="text" inputmode="text" autocomplete="off" required>
                    </div>
                    <p class="survey-hint">Enter the ID you copied from the game</p>
                    <button class="btn btn-primary" type="submit">Show surveys</button>
                </form>
            </section>

            <section id="survey-widget" class="surveys-section" hidden>
                <div id="cpx-surveys"></div>
            </section>
        </main>

        <footer class="footer">
            <p class="contact">
                <a href="mailto:info@mohanadgames.com">info@mohanadgames.com</a>
            </p>
            <div class="footer-links">
                <a href="/privacy-policy/">Privacy Policy</a>
            </div>
            <p class="copyright">&copy; Mohanad Games 2026</p>
        </footer>
    </div>

    <script src="/assets/js/cpx.js"></script>
    <script src="/assets/js/survey-gate.js"></script>
</body>
</html>
