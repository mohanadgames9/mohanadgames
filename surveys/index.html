    <meta name="description" content="حل استبيان واحصل على كوينزات داخل ألعاب Mohanad Games.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mohanadgames.com/surveys/">
    <link rel="alternate" hreflang="ar" href="https://mohanadgames.com/surveys/">
    <link rel="alternate" hreflang="en" href="https://mohanadgames.com/en/surveys/">
    <link rel="alternate" hreflang="x-default" href="https://mohanadgames.com/surveys/">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/images/logo-sm.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/site.css">

<body data-cpx-app-id="34253">
    <div class="page">
        <div class="topbar">
            <a class="lang-link" href="/en/surveys/" hreflang="en">English</a>
        </div>

        <header class="hero">
            <img class="hero-logo" src="/images/logo-sm.png" alt="Mohanad Games" width="88" height="88" fetchpriority="high">
            <h1>اكسب كوينزات</h1>
            <p>أجب على استبيان قصير واحصل على كوينزات داخل ألعابنا.</p>
            <div class="actions">
                <a class="btn btn-ghost" href="/">العودة للرئيسية</a>
            </div>
        </header>

        <main>
            <section id="survey-gate" class="survey-gate">
                <h2 class="survey-gate-title">أدخل معرّفك</h2>
                <form id="survey-gate-form">
                    <div class="survey-field">
                        <label for="survey-user-id">معرّف اللاعب</label>
                        <input id="survey-user-id" name="user_id" type="text" inputmode="text" autocomplete="off" required>
                    </div>
                    <p class="survey-hint">ادخل ال ID الذي نسخته من اللعبة</p>
                    <button class="btn btn-primary" type="submit">عرض الاستبيانات</button>
                </form>
            </section>

            <section id="survey-widget" class="surveys-section" hidden>
                <div id="cpx-surveys"></div>
            </section>
        </main>

        <footer class="footer">
            <p class="contact">
                <a href="mailto:info@mohanadgames.com">info@mohanadgames.com</a>
            </p>
            <div class="footer-links">
                <a href="/privacy-policy/">سياسة الخصوصية</a>
            </div>
            <p class="copyright">&copy; Mohanad Games 2026</p>
        </footer>
    </div>

    <script src="/assets/js/cpx.js"></script>
    <script src="/assets/js/survey-gate.js"></script>
